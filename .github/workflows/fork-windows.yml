# Fork build: unsigned Windows x64 portable PdfCraft with the fork's font changes
# (any installed font whose fsType allows editable embedding). Upstream's release.yml needs
# the project's signing secrets, which a fork does not have.
name: Fork Windows build

on:
  push:
    branches: [fontes-livres]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release -p pdfcraft --locked
        env:
          PDFCRAFT_REQUIRE_WINRES: "1"
          # The build knows its commit, so it can tell a newer release from itself (self-update).
          PDFCRAFT_BUILD_SHA: ${{ github.sha }}

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PdfCraft | Out-Null
          Copy-Item target/release/pdfcraft.exe dist/PdfCraft/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE dist/PdfCraft/
          # 7-Zip writes '/' separators as the ZIP spec requires (Compress-Archive on 5.1 writes '\').
          7z a -tzip dist/pdfcraft-fontes-livres-windows-x64-portable.zip ./dist/PdfCraft

      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-fontes-livres-windows-x64-portable
          path: dist/pdfcraft-fontes-livres-windows-x64-portable.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "fontes-livres-$(git rev-parse --short HEAD)"
          gh release create $tag dist/pdfcraft-fontes-livres-windows-x64-portable.zip `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
            --title "PdfCraft com fontes instaladas ($tag)" `
            --notes "Compilação própria, sem assinatura digital. Aceita qualquer fonte instalada cujo fabricante permita embutir para edição (fsType)."
